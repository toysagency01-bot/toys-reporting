<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TOYS Agency Platform</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090b0d;color:#f5f7f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#16302d 0,#090b0d 42%)}
    main{width:min(680px,100%);padding:32px;border:1px solid #28312f;border-radius:22px;background:rgba(17,20,22,.92);box-shadow:0 28px 80px rgba(0,0,0,.4)}
    b{color:#2ed6c4}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#143c37;color:#55e0d0;font-size:12px;font-weight:700}
    h1{margin:20px 0 10px;font-size:clamp(30px,6vw,52px);line-height:1}.muted{color:#929d9b;line-height:1.6}code{color:#55e0d0}
  </style>
</head>
<body>
  <main>
    <span class="badge">FOUNDATION · ЭТАП 1</span>
    <h1>TOYS Agency Platform</h1>
    <p class="muted">Новый фундамент дашбордов и CRM подготовлен отдельно от действующей системы. Живые проекты пока продолжают работать без изменений.</p>
    <p class="muted">Проверка сервера: <code>/api/health</code></p>
  </main>
</body>
</html>
